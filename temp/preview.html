<!DOCTYPE html>
<html>

<head>
    <title>Asset Preview</title>
    <style>
        body {
            background: #333;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }

        .asset-container {
            display: inline-block;
            margin: 20px;
            background-image: linear-gradient(45deg, #808080 25%, transparent 25%),
                linear-gradient(-45deg, #808080 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #808080 75%),
                linear-gradient(-45deg, transparent 75%, #808080 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #444;
            padding: 10px;
            border: 2px solid #666;
            border-radius: 8px;
        }

        img {
            max-width: 100%;
            image-rendering: pixelated;
        }

        h3 {
            margin-top: 0;
        }
    </style>
</head>

<body>
    <h1>Restored Assets Preview</h1>

    <div class="asset-container">
        <h3>Master Tileset</h3>
        <img src="master_tileset.png">
    </div>

    <div class="asset-container">
        <h3>Ghast Sprite Sheet</h3>
        <img src="ghast_sprite.png">
    </div>

    <div class="asset-container">
        <h3>Ravager Sprite Sheet</h3>
        <img src="ravager_sprite.png">
    </div>

    <div class="asset-container">
        <h3>Vex Sprite Sheet</h3>
        <img src="vex_sprite.png">
    </div>

    <div class="asset-container">
        <h3>Map Blueprint Reference</h3>
        <img src="map_blueprint_v2.png" style="max-width: 800px;">
    </div>

    <div class="asset-container">
        <h3>Original Reference</h3>
        <img src="original_reference.jpg" style="max-width: 800px;">
    </div>
</body>

</html>
