<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Maker - Decked Out 2D</title>
    <link rel="stylesheet" href="css/mapmaker.css">
</head>

<body>
    <!-- Top Control Bar -->
    <div id="control-bar">
        <div class="control-group">
            <label class="control-label">
                <input type="file" id="image-upload" accept=".webp,.png,.jpg,.jpeg" hidden>
                <button id="upload-btn" class="control-btn">📤 Load Image</button>
            </label>
            <button id="clear-image-btn" class="control-btn secondary">✕ Clear Image</button>
        </div>

        <div class="control-group image-controls" id="image-align-controls" style="display: none;">
            <label>Cell Size: <input type="number" id="cell-size" value="12" min="1" max="100">px</label>
            <button id="auto-calc-btn" class="control-btn">📐 Auto Calculate</button>
            <span class="separator">|</span>
            <label>Shift X: <input type="number" id="shift-x" value="0" step="1">px</label>
            <label>Shift Y: <input type="number" id="shift-y" value="0" step="1">px</label>
        </div>

        <div class="control-group">
            <button id="undo-btn" class="control-btn" title="Undo (Ctrl+Z)">↩️ Undo</button>
            <span class="separator">|</span>
            <label>Width: <input type="number" id="grid-width" value="40" min="5" max="200"></label>
            <label>Height: <input type="number" id="grid-height" value="30" min="5" max="200"></label>
            <button id="resize-btn" class="control-btn">Resize Grid</button>
        </div>

        <div class="control-group">
            <label>Image Opacity:
                <input type="range" id="opacity-slider" min="0" max="100" value="50">
                <span id="opacity-value">50%</span>
            </label>
            <label>Block Opacity:
                <input type="range" id="block-opacity-slider" min="0" max="100" value="50">
                <span id="block-opacity-value">50%</span>
            </label>
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="grid-toggle" checked>
                Show Grid
            </label>
        </div>

        <div class="control-group">
            <button id="clear-btn" class="control-btn secondary">🗑️ Clear Map</button>
            <button id="save-btn" class="control-btn primary">💾 Save Map</button>
            <button id="export-js-btn" class="control-btn">📄 Export JS</button>
            <label class="control-label">
                <input type="file" id="load-input" accept=".json" hidden>
                <button id="load-btn" class="control-btn">📂 Load Map</button>
            </label>
        </div>

        <div class="control-group">
            <a href="index.html" class="control-btn">🎮 Back to Game</a>
        </div>
    </div>

    <!-- Main Editor Area -->
    <div id="editor-container">
        <!-- Tile Palette Sidebar -->
        <div id="tile-palette">
            <h3>Tools</h3>
            <div id="tool-palette">
                <button class="tool-btn active" id="tool-paint" title="Paint (P)">🖌️ Paint</button>
                <button class="tool-btn" id="tool-fill" title="Fill (F)">🪣 Fill</button>
                <button class="tool-btn" id="tool-erase" title="Erase (E)">🧼 Erase</button>
            </div>

            <h3>Tiles</h3>
            <div id="tile-list">
                <!-- Tiles will be generated by JS -->
            </div>
        </div>

        <!-- Canvas Area -->
        <div id="canvas-container">
            <canvas id="map-canvas"></canvas>
        </div>

        <!-- Right Side Panel -->
        <div id="right-sidebar">
            <div id="tile-info-block">
                <h3>Selection</h3>
                <div id="current-tile-info">
                    <strong>Selected:</strong>
                    <span id="selected-tile-name">Stone</span>
                    <div id="tile-details-panel">
                        <!-- Dynamic Attributes go here -->
                    </div>
                </div>
            </div>

            <div id="attribute-block">
                <h3>Attributes</h3>
                <div id="attribute-palette">
                    <button class="attr-btn" data-attr="isArtifactSpot" title="Artifact Spawn Point">🔴 Artifact
                        Spot</button>
                    <button class="attr-btn" data-attr="isTreasure" title="Treasure/Ember Drop Spot">💰
                        Treasure</button>
                    <button class="attr-btn" data-attr="isExit" title="Exit Point">🚪 Exit</button>

                    <button class="attr-btn" data-attr="spawn:player" title="Player Start">🟢 Start</button>
                    <button class="attr-btn" data-attr="spawn:ravager" title="Enemy Spawn (Ravager)">👿 Ravager</button>
                    <button class="attr-btn" data-attr="spawn:ghast" title="Enemy Spawn (Ghast)">👻 Ghast</button>

                    <button class="attr-btn" id="clear-attr-btn" title="Clear Attributes">❌ Clear Attr</button>
                </div>
                <style>
                    #attribute-palette {
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 5px;
                        padding: 10px;
                    }
                </style>
            </div>

            <!-- Mini-Map -->
            <div id="minimap-container">
                <h3>Mini-Map</h3>
                <canvas id="minimap-canvas"></canvas>
            </div>
        </div>
    </div>
    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal hidden">
        <div class="modal-content">
            <p id="confirm-message">Are you sure?</p>
            <div class="modal-buttons">
                <button id="confirm-yes" class="control-btn primary">Yes, Clear</button>
                <button id="confirm-no" class="control-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar">
        <span id="cursor-pos">Tile: (0, 0)</span>
        <span id="map-size">Map: 40 × 30</span>
        <span id="zoom-level">Zoom: 100%</span>
    </div>

    <script type="module" src="js/mapmaker.js"></script>
</body>

</html>
