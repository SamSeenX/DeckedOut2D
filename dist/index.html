<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decked Out 2D by SamSeen</title>
    <link rel="icon" href="/assets/favicon-BAh9kyrF.png">
  <script type="module" crossorigin src="/assets/index-DumZLxjo.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CozZBg2I.css">
</head>

<body>

    <div id="game-container">
        <div id="start-overlay">
            <div class="start-text">DECKED OUT 2D</div>
            <div class="start-subtext">Click to Enter</div>
        </div>

        <div id="game-over-overlay" class="hidden">
            <div class="start-text" style="color: red;">GAME OVER</div>
            <div class="start-subtext">Click to Retry</div>
        </div>

        <div id="victory-overlay" class="hidden">
            <div class="start-text">VICTORY!</div>
            <div id="victory-card">
                <div id="victory-artifact-icon">👑</div>
                <h2 id="victory-artifact-name">Crown of Souls</h2>
                <p id="victory-artifact-desc">A jagged iron crown...</p>
                <div class="victory-stats">
                    <div class="stat-row">
                        <span>🔥 Embers Collected:</span>
                        <strong id="victory-embers">0</strong>
                    </div>
                </div>
            </div>
            <div class="start-subtext">Click to Escaping</div>
        </div>

        <!-- NEW: Cinematic Intro Layer -->
        <div id="cinematic-overlay" class="hidden">
            <canvas id="intro-particles"></canvas>
            <div id="door-container">
                <img id="door-left" src="/assets/door_left-ABEFfOnQ.webp" alt="Door Left">
                <img id="door-right" src="/assets/door_right-CwskD9A1.webp" alt="Door Right">
            </div>
        </div>

        <div id="ui-layer">
            <div id="top-bar">
                <div class="hud-item">CLANK: <span id="clank-display">0</span></div>
                <div class="hud-item hud-hp">
                    <div id="hp-container"></div>
                </div>
            </div>

            <div id="bottom-bar">
                <div class="hud-group">
                    <div id="compass-container" title="Points to Artifact or Exit">
                        <div id="compass-needle">➤</div>
                    </div>
                </div>

                <div class="hud-group">
                    <div class="hud-icon">🔥</div>
                    <span id="ember-display">0</span>
                </div>

                <div class="hud-group">
                    <div class="hud-icon">🍒</div>
                    <span id="food-display">0</span>
                    <small>F to Eat</small>
                </div>

                <div class="hud-group" id="artifact-slot">
                    <div class="hud-label">Artifact</div>
                    <div id="artifact-icon" class="empty">?</div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

</body>

</html>
