<body>

    <div class="container">
        <h1>404</h1>
        <div class="subtitle">You have lost your way.</div>

        <p id="joke-text">Loading witty dungeon humor...</p>

        <a href="/" class="btn">Return to Safety (Home)</a>
    </div>

    <script>
        const jokes = [
            "The Frost Beast heard you clicking... and ate this page.",
            "You stumbled into the Void. There is nothing here but code.",
            "This page is behind a Level 4 door. You don't have the key.",
            "You generated too much 'Haze'. The server got scared and hid this page.",
            "This artifact has not been discovered yet.",
            "Looks like a Witch threw a splash potion of Invisibility on this content.",
            "404: Dungeon Not Found.",
            "You fell through a hole in the map. Good job.",
            "The Deck is shuffled, and this card was not drawn.",
            "Even the Compass can't find what you are looking for."
        ];

        function setRandomJoke() {
            const joke = jokes[Math.floor(Math.random() * jokes.length)];
            document.getElementById('joke-text').textContent = `"${joke}"`;
        }

        setRandomJoke();
    </script>
